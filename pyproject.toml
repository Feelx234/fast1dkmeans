[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fast1dkmeans"
dynamic = ["version"]
authors = [{ name = "Felix I. Stamm", email = "felix.stamm@rwth-aachen.de" }]
description = "A python package for optimal 1d k-means clustering."
readme = "README.md"
keywords = ["clustering", "kmeans", "k-means"]
requires-python = ">=3.9"
dependencies = ["numpy >= 1.23.5"]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Homepage" = "https://github.com/Feelx234/fast1dkmeans"
"Bug Tracker" = "https://github.com/Feelx234/fast1dkmeans/issues"

[tool.maturin]
python-source = "python"
module-name = "fast1dkmeans._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
