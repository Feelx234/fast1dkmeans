[package]
name = "fast1dkmeans-py"
version = "0.2.0"
edition = "2021"
license = "BSD-3-Clause"
authors = ["Felix I. Stamm <felix.stamm@rwth-aachen.de>"]
repository = "https://github.com/Feelx234/fast1dkmeans"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
optimal1d = { git = "https://github.com/Feelx234/optimal1d", rev = "078f56a2c0f996e2744c27bbc23e63d4ba404e77" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
